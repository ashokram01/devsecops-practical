name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Image
        run: docker build -t my-app .
        
      - name: Shift-Left Security (Trivy Scan)
        run: trivy image --exit-code 1 --severity CRITICAL my-app
